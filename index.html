<script>
const timer = setInterval(() => {
  const h1 = document.querySelector('h1');
  if (!h1) return;

  clearInterval(timer);
  h1.innerHTML = 'Hello';
  h1.style.cssText = 'font-size:50px;color:blue';
  h1.append(Object.assign(document.createElement('span'), {
    innerText: ' ~ Unknown user ~'
  }));
}, 300);
</script>
<font color="white">TEST</font>
